<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLESS to Clash YAML 转换工具</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>VLESS → Clash Meta YAML</h1>
            <p class="subtitle">批量将 VLESS 链接转换为 Mihomo Party / Clash Meta 可导入的 YAML 配置</p>
            <span id="version-badge" class="version-badge">v—</span>
        </header>

        <div class="card">
            <div class="card-header">
                <span class="card-icon">📋</span>
                <h2>输入代理链接</h2>
            </div>
            <textarea id="vless-input" placeholder="每行粘贴一个代理链接，支持 VLESS / VMess / SS / SSR / Trojan，支持批量导入&#10;&#10;示例：&#10;vless://uuid@server:port?type=tcp&security=reality&sni=apple.com&pbk=xxx&sid=xxx&fp=chrome#节点名称&#10;vmess://eyJ2IjoiMiIsInBzIjoi5Y+R6YeN5p2lIiwiYWRkIjoiMS4yLjMuNCIsInBvcnQiOiI0NDMiLCJpZCI6Inh4eCIsImFpZCI6IjAiLCJuZXQiOiJ3cyIsInBhdGgiOiIvIn0=&#10;trojan://password@server:443?sni=example.com#节点名称"></textarea>
        </div>

        <div class="card card-name-config">
            <div class="card-header">
                <span class="card-icon">🏷️</span>
                <h2>配置名称</h2>
                <span class="name-hint">Clash 导入后显示的名称</span>
            </div>
            <div class="name-config-row">
                <input type="text" id="cfg-name" class="name-input" placeholder="留空自动生成：单链接用节点名，多链接用随机 Token">
            </div>
        </div>

        <div class="card">
            <div class="card-header collapsible" onclick="toggleSubscription()">
                <span class="card-icon">🔗</span>
                <h2>订阅地址（可选）</h2>
                <span class="toggle-arrow" id="sub-arrow">▼</span>
            </div>
            <div id="subscription-section" class="collapsible-content" style="display:none;">
                <textarea id="subscription-input" placeholder="每行一个订阅地址，支持 Base64 编码的订阅&#10;&#10;示例：&#10;https://example.com/sub1&#10;https://example.com/sub2"></textarea>
            </div>
        </div>

        <div class="card">
            <div class="card-header collapsible" onclick="toggleConfig()">
                <span class="card-icon">⚙️</span>
                <h2>配置选项（可选）</h2>
                <span class="toggle-arrow" id="config-arrow">▼</span>
            </div>
            <div id="config-section" class="collapsible-content" style="display:none;">
                <div class="config-grid">
                    <div class="config-item">
                        <label>混合端口</label>
                        <input type="number" id="cfg-port" value="7890">
                    </div>
                    <div class="config-item">
                        <label>允许局域网</label>
                        <select id="cfg-allow-lan">
                            <option value="true" selected>是</option>
                            <option value="false">否</option>
                        </select>
                    </div>
                    <div class="config-item">
                        <label>运行模式</label>
                        <select id="cfg-mode">
                            <option value="rule" selected>rule</option>
                            <option value="global">global</option>
                            <option value="direct">direct</option>
                        </select>
                    </div>
                    <div class="config-item">
                        <label>日志级别</label>
                        <select id="cfg-log-level">
                            <option value="info" selected>info</option>
                            <option value="debug">debug</option>
                            <option value="warning">warning</option>
                            <option value="error">error</option>
                            <option value="silent">silent</option>
                        </select>
                    </div>
                    <div class="config-item">
                        <label>策略组名称</label>
                        <input type="text" id="cfg-group-name" value="节点选择">
                    </div>
                    <div class="config-item">
                        <label>分流规则</label>
                        <select id="cfg-rules-mode">
                            <option value="basic" selected>基础（内置国内直连）</option>
                            <option value="remote">完整（远程 Loyalsoldier）</option>
                            <option value="none">无规则（等同于全局代理）</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button id="convert-btn" class="btn btn-primary" onclick="convert()">
                <span class="btn-icon">⚡</span> 一键转换
            </button>
            <button class="btn btn-secondary" onclick="loadExample()">
                <span class="btn-icon">📝</span> 加载示例
            </button>
            <button class="btn btn-secondary" onclick="clearAll()">
                <span class="btn-icon">🗑</span> 清空
            </button>
        </div>

        <div id="status-bar" class="status-bar" style="display:none;"></div>

        <div id="result-section" style="display:none;">
            <div class="card result-card">
                <div class="card-header">
                    <span class="card-icon">📄</span>
                    <h2>转换结果</h2>
                </div>
                <div id="proxy-summary" class="proxy-summary"></div>
                <div id="download-link-section" class="download-link-section" style="display:none;">
                    <div class="download-link-box">
                        <div class="download-link-info">
                            <span class="file-badge" id="file-badge">token</span>
                            <input type="text" id="download-url-input" class="url-input" readonly>
                        </div>
                        <div class="download-link-actions">
                            <button class="btn btn-small" onclick="copyLink()">
                                <span class="btn-icon">🔗</span> 复制链接
                            </button>
                            <a id="download-anchor" class="btn btn-small btn-download" href="#" download>
                                <span class="btn-icon">⬇</span> 下载文件
                            </a>
                        </div>
                    </div>
                </div>
                <div class="result-actions-inline">
                    <button class="btn btn-small" onclick="copyResult()">
                        <span class="btn-icon">📋</span> 复制配置
                    </button>
                </div>
                <pre id="yaml-output" class="yaml-output"></pre>
            </div>
        </div>

        <div id="error-section" style="display:none;">
            <div class="card error-card">
                <div class="card-header">
                    <span class="card-icon">⚠️</span>
                    <h2>错误信息</h2>
                </div>
                <div id="error-list" class="error-list"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
